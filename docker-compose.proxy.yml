# ============================================
# Plasma AI - TLS reverse proxy (Caddy), optional layer
# ============================================
# Add it to either stack:
#   production: docker compose -f docker-compose.yml -f docker-compose.proxy.yml up -d caddy
#   staging:    scripts/ops/compose-staging.sh --proxy up -d caddy
#
# Caddy is the only service that publishes 80/443. It reaches the frontend and
# backend over the Compose network exactly as the frontend reaches the backend
# today (browser -> frontend, /api/v1/* rewritten to backend:8000 by Next.js);
# the API host is for health checks and direct API clients.
#
# Required variables (see .env.staging.example): APP_DOMAIN, API_DOMAIN, ACME_EMAIL.
# Staging sets PROXY_CONTAINER_NAME=plasma_staging_caddy; its volumes are already
# project-prefixed and explicitly named in docker-compose.staging.yml.

services:
  caddy:
    image: caddy:2.8-alpine
    container_name: ${PROXY_CONTAINER_NAME:-plasma_caddy}
    restart: always
    depends_on:
      - frontend
      - backend
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
      # Point at Let's Encrypt staging while testing new domains to avoid rate limits:
      # ACME_CA: https://acme-staging-v02.api.letsencrypt.org/directory
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
      FRONTEND_UPSTREAM: frontend:3000
      BACKEND_UPSTREAM: backend:8000
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
      - "${PROXY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
