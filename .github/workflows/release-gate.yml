name: Release gate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: plasma_s05b4b_ci
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      ENVIRONMENT: test
      PLASMA_RELEASE_TEST_CONFIRM: DISPOSABLE_LOCAL_ONLY
      POSTGRES_SERVER: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: disposable-ci-only
      POSTGRES_DB: plasma_s05b4b_ci
      SECRET_KEY: synthetic-ci-signing-key-never-for-runtime
      AUTH_BRIDGE_SECRET: synthetic-ci-bridge-key-never-for-runtime
      TELEGRAM_BOT_TOKEN: synthetic-ci-only
      GOOGLE_API_KEY: synthetic-ci-only
      GEMINI_API_KEY: synthetic-ci-only
      AUTO_CREATE_TABLES: "false"
      CELERY_BROKER_URL: memory://
      CELERY_RESULT_BACKEND: cache+memory://
      AUTH_REPLAY_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/constraints.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - run: bash scripts/run_release_gate.sh all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controlled-browser-results
          path: docs/audits/s9_3/browser/
