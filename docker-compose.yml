# ============================================
# Plasma AI — Docker Compose (Full Stack)
# ============================================

services:
  # ---- Database ----
  db:
    image: postgres:16
    container_name: plasma_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plasma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plasma_secure_dev_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-plasma_ai}
    ports:
      - "6543:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ---- Database GUI ----
  pgadmin:
    image: dpage/pgadmin4
    container_name: plasma_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@plasmaos.com"
      PGADMIN_DEFAULT_PASSWORD: "Samadov772." 
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - db
    restart: unless-stopped

  # ---- Redis (Auth Codes) ----
  redis:
    image: redis:7-alpine
    container_name: plasma_redis
    restart: always
    command: [ "redis-server", "--save", "", "--appendonly", "no", "--dir", "/tmp" ]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---- Backend (FastAPI) ----
  backend:
    build:
      context: ./backend
      args:
        PLASMA_BUILD_SHA: ${PLASMA_BUILD_SHA:-unknown}
        PLASMA_BUILD_TIME: ${PLASMA_BUILD_TIME:-unknown}
    container_name: plasma_backend
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      # Override to point at Docker service names
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      TENDER_DOCUMENTS_ROOT: /app/data/documents
      AUTO_CREATE_TABLES: "false"
      PLASMA_SERVICE_NAME: backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - tender_documents_data:/app/data

  # ---- Frontend (Next.js) ----
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${FRONTEND_NEXT_PUBLIC_API_URL:-/api/v1}
        BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000/api/v1}
        PLASMA_BUILD_SHA: ${PLASMA_BUILD_SHA:-unknown}
        PLASMA_BUILD_TIME: ${PLASMA_BUILD_TIME:-unknown}
    container_name: plasma_frontend
    restart: always
    depends_on:
      - backend
    environment:
      # Internal Docker network URL for server-side API calls (NextAuth)
      BACKEND_INTERNAL_URL: http://backend:8000/api/v1
      NEXT_PUBLIC_API_URL: ${FRONTEND_NEXT_PUBLIC_API_URL:-/api/v1}
      PLASMA_SERVICE_NAME: frontend
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_URL: https://console.plasmaos.uz
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    ports:
      - "127.0.0.1:3000:3000"

  # ---- Celery Worker ----
  celery_worker:
    build:
      context: ./backend
      args:
        PLASMA_BUILD_SHA: ${PLASMA_BUILD_SHA:-unknown}
        PLASMA_BUILD_TIME: ${PLASMA_BUILD_TIME:-unknown}
    container_name: plasma_celery_worker
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      WORLD_BANK_AUTODRAIN_BATCH_SIZE: ${WORLD_BANK_AUTODRAIN_BATCH_SIZE:-25}
      WORLD_BANK_ENRICHMENT_RETRY_BACKOFF_SECONDS: ${WORLD_BANK_ENRICHMENT_RETRY_BACKOFF_SECONDS:-900}
      PLASMA_SERVICE_NAME: celery_worker
    command: [ "celery", "-A", "app.core.celery_app", "worker", "--loglevel=info", "-Q", "celery,ai_fast_queue" ]

  worker_heavy:
    build:
      context: ./backend
      args:
        PLASMA_BUILD_SHA: ${PLASMA_BUILD_SHA:-unknown}
        PLASMA_BUILD_TIME: ${PLASMA_BUILD_TIME:-unknown}
    container_name: plasma_worker_heavy
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_WORKER_MAX_TASKS_PER_CHILD: 10
      TENDER_DOCUMENTS_ROOT: /app/data/documents
      PLASMA_SERVICE_NAME: worker_heavy
    command: [ "celery", "-A", "app.core.celery_app", "worker", "--loglevel=info", "-Q", "heavy_dl_queue", "--concurrency=1", "--max-tasks-per-child=10" ]
    volumes:
      - tender_documents_data:/app/data

  # ---- Celery Beat (Scheduler) ----
  celery_beat:
    build:
      context: ./backend
      args:
        PLASMA_BUILD_SHA: ${PLASMA_BUILD_SHA:-unknown}
        PLASMA_BUILD_TIME: ${PLASMA_BUILD_TIME:-unknown}
    container_name: plasma_celery_beat
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      WORLD_BANK_AUTODRAIN_INTERVAL_SECONDS: ${WORLD_BANK_AUTODRAIN_INTERVAL_SECONDS:-60}
      PLASMA_SERVICE_NAME: celery_beat
    command: [ "celery", "-A", "app.core.celery_app", "beat", "--loglevel=info" ]


volumes:
  postgres_data:
  tender_documents_data:
