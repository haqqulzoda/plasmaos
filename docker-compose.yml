# ============================================
# Plasma AI — Docker Compose (Full Stack)
# ============================================

services:
  # ---- Database ----
  db:
    image: postgres:16
    container_name: plasma_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plasma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plasma_secure_dev_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-plasma_ai}
    ports:
      - "6543:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ---- Redis (Auth Codes) ----
  redis:
    image: redis:7-alpine
    container_name: plasma_redis
    restart: always
    ports:
      - "6379:6379"

  # ---- Backend (FastAPI) ----
  backend:
    build: ./backend
    container_name: plasma_backend
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      # Override to point at Docker service names
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      TENDER_DOCUMENTS_ROOT: /app/data/documents
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - tender_documents_data:/app/data

  # ---- Frontend (Next.js) ----
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: plasma_frontend
    restart: always
    depends_on:
      - backend
    environment:
      # Internal Docker network URL for server-side API calls (NextAuth)
      BACKEND_INTERNAL_URL: http://backend:8000/api/v1
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_URL: https://console.plasmaos.uz
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    ports:
      - "127.0.0.1:3000:3000"

  # ---- Celery Worker ----
  celery_worker:
    build: ./backend
    container_name: plasma_celery_worker
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    command: [ "celery", "-A", "app.core.celery_app", "worker", "--loglevel=info", "-Q", "celery,ai_fast_queue" ]

  worker_heavy:
    build: ./backend
    container_name: plasma_worker_heavy
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_WORKER_MAX_TASKS_PER_CHILD: 10
      TENDER_DOCUMENTS_ROOT: /app/data/documents
    command: [ "celery", "-A", "app.core.celery_app", "worker", "--loglevel=info", "-Q", "heavy_dl_queue", "--concurrency=1", "--max-tasks-per-child=10" ]
    volumes:
      - tender_documents_data:/app/data

  # ---- Celery Beat (Scheduler) ----
  celery_beat:
    build: ./backend
    container_name: plasma_celery_beat
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    command: [ "celery", "-A", "app.core.celery_app", "beat", "--loglevel=info" ]

volumes:
  postgres_data:
  tender_documents_data:
