# ============================================
# Plasma AI — Docker Compose (Full Stack)
# ============================================

services:
  # ---- Database ----
  db:
    image: postgres:16
    container_name: plasma_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plasma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-plasma_ai}
    ports:
      # Host-run FastAPI uses the root .env port while keeping PostgreSQL
      # inaccessible from other machines.
      - "127.0.0.1:6543:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ---- Database GUI (opt-in only: docker compose --profile tools up -d pgadmin) ----
  # Never started by a default `up`, in production or staging.
  pgadmin:
    image: dpage/pgadmin4
    profiles: ["tools"]
    container_name: plasma_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "True"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - db
    restart: unless-stopped

  # ---- Redis (Auth Codes) ----
  redis:
    image: redis:7-alpine
    container_name: plasma_redis
    restart: always
    command: [ "redis-server", "--save", "", "--appendonly", "yes", "--appendfsync", "always", "--dir", "/data" ]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---- Malware scanning for organization-private uploads ----
  clamav:
    image: clamav/clamav:1.4
    container_name: plasma_clamav
    restart: always
    # The image keeps running after clamd dies (e.g. OOM-killed), which leaves uploads
    # unscanned; the wrapper exits instead so `restart: always` restarts it.
    entrypoint: ["/sbin/tini", "--", "/bin/sh", "/plasma/supervise.sh"]
    volumes:
      - ./deploy/clamav/supervise.sh:/plasma/supervise.sh:ro
    environment:
      # Reload signatures in place instead of loading a second copy next to the first:
      # peak memory stays at one signature set (~1.3 GB) instead of two, at the cost of
      # scans waiting for the reload (tens of seconds, a few times a day).
      CLAMD_CONF_ConcurrentDatabaseReload: "no"

  # ---- Backend (FastAPI) ----
  backend:
    build:
      context: ./backend
      args:
        PLASMA_BUILD_SHA: ${PLASMA_BUILD_SHA:-unknown}
        PLASMA_BUILD_TIME: ${PLASMA_BUILD_TIME:-unknown}
    container_name: plasma_backend
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      # Override to point at Docker service names
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      TENDER_DOCUMENTS_ROOT: /app/data/documents
      AUTO_CREATE_TABLES: "false"
      AUTH_REPLAY_REDIS_URL: redis://redis:6379/0
      AUTH_BRIDGE_SECRET: ${AUTH_BRIDGE_SECRET:?Set AUTH_BRIDGE_SECRET}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:?Set explicit HTTPS origins}
      PLASMA_SERVICE_NAME: backend
      PRIVATE_DOCUMENT_STORAGE_ROOT: /app/private-data
      PRIVATE_DOCUMENT_SCAN_HOST: clamav
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - tender_documents_data:/app/data
      - private_documents_data:/app/private-data

  # ---- Frontend (Next.js) ----
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${FRONTEND_NEXT_PUBLIC_API_URL:-/api/v1}
        # Next.js compiles rewrites during the image build. Always target the
        # Compose service here; frontend/.env uses a loopback URL for running
        # Next.js directly on the host, which is unreachable inside a container.
        BACKEND_INTERNAL_URL: http://backend:8000/api/v1
        PLASMA_BUILD_SHA: ${PLASMA_BUILD_SHA:-unknown}
        PLASMA_BUILD_TIME: ${PLASMA_BUILD_TIME:-unknown}
    container_name: plasma_frontend
    restart: always
    depends_on:
      - backend
    environment:
      # Internal Docker network URL for server-side API calls (NextAuth)
      BACKEND_INTERNAL_URL: http://backend:8000/api/v1
      NEXT_PUBLIC_API_URL: ${FRONTEND_NEXT_PUBLIC_API_URL:-/api/v1}
      PLASMA_SERVICE_NAME: frontend
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      AUTH_BRIDGE_SECRET: ${AUTH_BRIDGE_SECRET:?Set AUTH_BRIDGE_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?Set NEXTAUTH_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    ports:
      - "127.0.0.1:3000:3000"

  # ---- Celery Worker ----
  celery_worker:
    build:
      context: ./backend
      args:
        PLASMA_BUILD_SHA: ${PLASMA_BUILD_SHA:-unknown}
        PLASMA_BUILD_TIME: ${PLASMA_BUILD_TIME:-unknown}
    container_name: plasma_celery_worker
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      WORLD_BANK_AUTODRAIN_BATCH_SIZE: ${WORLD_BANK_AUTODRAIN_BATCH_SIZE:-25}
      WORLD_BANK_ENRICHMENT_RETRY_BACKOFF_SECONDS: ${WORLD_BANK_ENRICHMENT_RETRY_BACKOFF_SECONDS:-900}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      AUTH_BRIDGE_SECRET: ${AUTH_BRIDGE_SECRET:?Set AUTH_BRIDGE_SECRET}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:?Set explicit HTTPS origins}
      PLASMA_SERVICE_NAME: celery_worker
    command: [ "celery", "-A", "app.core.celery_app", "worker", "--loglevel=info", "-Q", "celery,ai_fast_queue" ]

  worker_heavy:
    build:
      context: ./backend
      args:
        PLASMA_BUILD_SHA: ${PLASMA_BUILD_SHA:-unknown}
        PLASMA_BUILD_TIME: ${PLASMA_BUILD_TIME:-unknown}
    container_name: plasma_worker_heavy
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_WORKER_MAX_TASKS_PER_CHILD: 10
      TENDER_DOCUMENTS_ROOT: /app/data/documents
      ENVIRONMENT: ${ENVIRONMENT:-production}
      AUTH_BRIDGE_SECRET: ${AUTH_BRIDGE_SECRET:?Set AUTH_BRIDGE_SECRET}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:?Set explicit HTTPS origins}
      PLASMA_SERVICE_NAME: worker_heavy
    command: [ "celery", "-A", "app.core.celery_app", "worker", "--loglevel=info", "-Q", "heavy_dl_queue", "--concurrency=1", "--max-tasks-per-child=10" ]
    volumes:
      - tender_documents_data:/app/data

  worker_private_documents:
    build:
      context: ./backend
      args:
        PLASMA_BUILD_SHA: ${PLASMA_BUILD_SHA:-unknown}
        PLASMA_BUILD_TIME: ${PLASMA_BUILD_TIME:-unknown}
    container_name: plasma_worker_private_documents
    restart: always
    depends_on:
      - db
      - redis
      - clamav
    env_file:
      - .env
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      PRIVATE_DOCUMENT_STORAGE_ROOT: /app/private-data
      PRIVATE_DOCUMENT_SCAN_HOST: clamav
      CELERY_WORKER_MAX_TASKS_PER_CHILD: 10
      ENVIRONMENT: ${ENVIRONMENT:-production}
      AUTH_BRIDGE_SECRET: ${AUTH_BRIDGE_SECRET:?Set AUTH_BRIDGE_SECRET}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:?Set explicit HTTPS origins}
      PLASMA_SERVICE_NAME: worker_private_documents
    command: [ "celery", "-A", "app.core.celery_app", "worker", "--loglevel=info", "-Q", "private_documents", "--concurrency=1", "--max-tasks-per-child=10" ]
    volumes:
      - private_documents_data:/app/private-data

  worker_pursuit_analysis:
    build:
      context: ./backend
      args:
        PLASMA_BUILD_SHA: ${PLASMA_BUILD_SHA:-unknown}
        PLASMA_BUILD_TIME: ${PLASMA_BUILD_TIME:-unknown}
    container_name: plasma_worker_pursuit_analysis
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      PLASMA_SERVICE_NAME: worker_pursuit_analysis
    command: [ "celery", "-A", "app.core.celery_app", "worker", "--loglevel=info", "-Q", "pursuit_analysis", "--concurrency=${PURSUIT_ANALYSIS_WORKER_CONCURRENCY:-2}", "--max-tasks-per-child=10" ]
    depends_on:
      - db
      - redis

  # ---- Celery Beat (Scheduler) ----
  celery_beat:
    build:
      context: ./backend
      args:
        PLASMA_BUILD_SHA: ${PLASMA_BUILD_SHA:-unknown}
        PLASMA_BUILD_TIME: ${PLASMA_BUILD_TIME:-unknown}
    container_name: plasma_celery_beat
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      WORLD_BANK_AUTODRAIN_INTERVAL_SECONDS: ${WORLD_BANK_AUTODRAIN_INTERVAL_SECONDS:-60}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      AUTH_BRIDGE_SECRET: ${AUTH_BRIDGE_SECRET:?Set AUTH_BRIDGE_SECRET}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:?Set explicit HTTPS origins}
      PLASMA_SERVICE_NAME: celery_beat
    command: [ "celery", "-A", "app.core.celery_app", "beat", "--loglevel=info" ]


volumes:
  redis_data:
  postgres_data:
  tender_documents_data:
  private_documents_data:
